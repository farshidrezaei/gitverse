name: GitVerse Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Quality & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf libssl-dev rpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend quality gates
        run: |
          npm run validate:i18n
          npm run typecheck
          npm run test:unit
          pnpm run build

      - name: Run Rust format, clippy, and test matrix
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  prepare_release:
    name: Prepare Draft Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create or reuse draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          EXISTING_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1 || true)
          if [ -n "${EXISTING_ID}" ]; then
            echo "Found existing draft release ${EXISTING_ID} for ${TAG}"
            echo "release_id=${EXISTING_ID}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v ver="## [${VERSION}]" '
              index($0, ver) == 1 { capture=1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md | sed '/./,$!d')
          fi
          if [ -z "${NOTES}" ]; then
            NOTES="Cross-platform desktop installers for Linux (.deb, .rpm, .AppImage), Windows (.exe, .msi), and macOS (.dmg), plus signed in-app updater artifacts."
          fi

          RELEASE_ID=$(jq -n --arg tag "${TAG}" --arg commit "${GITHUB_SHA}" --arg name "GitVerse ${TAG}" --arg body "${NOTES}" \
            '{tag_name: $tag, target_commitish: $commit, name: $name, body: $body, draft: true, prerelease: false}' | \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input - --jq '.id')

          if [ -z "${RELEASE_ID}" ]; then
            echo "Failed to resolve created draft release ID for ${TAG}" >&2
            exit 1
          fi
          echo "Created draft release ${RELEASE_ID} for ${TAG}"
          echo "release_id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Build & Publish (${{ matrix.platform.name }})
    needs: prepare_release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux
            os: ubuntu-latest
            args: ''
          - name: macOS
            os: macos-latest
            args: '--target universal-apple-darwin'
          - name: Windows
            os: windows-latest
            args: ''
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.os == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf libssl-dev rpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run build

      - name: Build Tauri installers and updater manifest
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          releaseId: ${{ needs.prepare_release.outputs.release_id }}
          args: ${{ matrix.platform.args }}

  finalize_release:
    name: Publish Release & Notify Telegram
    needs: [prepare_release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          mkdir -p ./dist_assets
          gh release download "$TAG" --dir ./dist_assets || true
          if [ -d ./dist_assets ] && [ "$(ls -A ./dist_assets 2>/dev/null)" ]; then
            cd ./dist_assets
            sha256sum * > SHA256SUMS.txt
            gh release upload "$TAG" SHA256SUMS.txt --clobber
          fi

      - name: Publish draft release with changelog notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare_release.outputs.release_id }}
        run: node scripts/publish-github-release.mjs

      - name: Broadcast Release to Telegram Channel
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare_release.outputs.release_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/send-telegram-release.mjs
