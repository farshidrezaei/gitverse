[package]
name = "gitverse"
version = "1.0.0"
default-run = "gitverse"
description = "Local-first, cross-platform Git client desktop application."
authors = ["GitVerse Contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "gitverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gitverse"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
rusqlite = { version = "0.42", features = ["bundled"] }
notify = "8"
notify-debouncer-mini = "0.6"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3"
proptest = "1"
